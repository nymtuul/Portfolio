<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Location v2 — improvements</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Serif+Display&family=Bebas+Neue&family=Courier+Prime:wght@400;700&family=Caveat:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Anton&family=Abril+Fatface&family=Oswald:wght@400;700&display=swap" rel="stylesheet" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: #fce9ef;
    background-image:
      radial-gradient(circle at 15% 20%, #fcd4e155 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, #fcd4e188 0%, transparent 40%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .annotate {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #b87090;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    z-index: 9999;
    border: 1px dashed #b87090;
  }
  .bubble-cycle {
    transition: opacity 500ms ease, transform 500ms ease;
  }
  .scrap-tilt:hover {
    transform: rotate(0deg) translateY(-4px) !important;
    transition: transform 300ms cubic-bezier(.2,.9,.3,1.3);
  }
  .scrap-tilt {
    transition: transform 300ms cubic-bezier(.2,.9,.3,1.3);
  }
</style>
</head>
<body>

<div id="root"></div>

<div class="annotate">design mock · v2 improvements</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="collage-primitives.jsx"></script>

<script type="text/babel">

const palette = {
  accent: '#fcd4e1',
  denim:  '#f4a8c2',
  navy:   '#b87090',
  cream:  '#fff8fb',
};

// Floating icon (cartoon, like reference inspo)
function FloatingIcon({ kind, top, left, rotate = 0, size = 44, zIndex = 5 }) {
  const icons = {
    plane: <svg viewBox="0 0 32 32"><path d="M 16 4 L 19 14 L 30 16 L 19 18 L 17 28 L 14 18 L 2 16 L 14 14 Z" fill="#7ab8e0" stroke="#fff" strokeWidth="1.5" /></svg>,
    sparkle: <svg viewBox="0 0 24 24"><path d="M 12 2 L 14 10 L 22 12 L 14 14 L 12 22 L 10 14 L 2 12 L 10 10 Z" fill="#fcd86a" stroke="#fff" strokeWidth="1.2" /></svg>,
    heart: <svg viewBox="0 0 24 24"><path d="M 12 21 C 4 14 2 9 5 6 C 8 3 11 6 12 8 C 13 6 16 3 19 6 C 22 9 20 14 12 21 Z" fill="#ff8aa8" stroke="#fff" strokeWidth="1.5" /></svg>,
    star: <svg viewBox="0 0 24 24"><path d="M 12 2 L 15 9 L 22 9 L 16 14 L 18 22 L 12 17 L 6 22 L 8 14 L 2 9 L 9 9 Z" fill="#fcd86a" stroke="#fff" strokeWidth="1.5" /></svg>,
    cart: <svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="#7ab8e0" /><path d="M 8 10 L 22 10 L 20 18 L 11 18 Z" fill="#fff" /><circle cx="12" cy="22" r="2" fill="#fff" /><circle cx="19" cy="22" r="2" fill="#fff" /></svg>,
    book: <svg viewBox="0 0 30 30"><rect x="4" y="6" width="22" height="20" fill="#a8d68a" stroke="#fff" strokeWidth="1.5" rx="1" /><line x1="15" y1="6" x2="15" y2="26" stroke="#fff" strokeWidth="1.5" /></svg>,
    coffee: <svg viewBox="0 0 30 30"><path d="M 6 10 L 22 10 L 20 24 Q 20 26 18 26 L 10 26 Q 8 26 8 24 Z" fill="#8a5a3a" stroke="#fff" strokeWidth="1.5" /><path d="M 22 14 Q 28 14 28 20 Q 28 24 22 24" fill="none" stroke="#8a5a3a" strokeWidth="2" /><line x1="11" y1="4" x2="11" y2="8" stroke="#fff" strokeWidth="2" strokeLinecap="round" /><line x1="15" y1="4" x2="15" y2="8" stroke="#fff" strokeWidth="2" strokeLinecap="round" /><line x1="19" y1="4" x2="19" y2="8" stroke="#fff" strokeWidth="2" strokeLinecap="round" /></svg>,
    pin: <svg viewBox="0 0 24 32"><path d="M 12 2 C 6 2 3 6 3 12 C 3 20 12 30 12 30 C 12 30 21 20 21 12 C 21 6 18 2 12 2 Z" fill="#ff5a8a" stroke="#fff" strokeWidth="1.5" /><circle cx="12" cy="12" r="4" fill="#fff" /></svg>,
  };
  return (
    <div className="scrap-tilt" style={{
      position: 'absolute',
      top, left,
      width: size, height: size,
      transform: `rotate(${rotate}deg)`,
      filter: 'drop-shadow(2px 4px 4px rgba(0,0,0,0.15))',
      zIndex,
    }}>
      {icons[kind]}
    </div>
  );
}

function Bubble({ children, top, left, rotate = 0, emoji, big = false, color = '#fff' }) {
  return (
    <div className="scrap-tilt" style={{
      position: 'absolute',
      top, left,
      background: color,
      borderRadius: 999,
      padding: big ? '14px 26px' : '10px 20px',
      fontFamily: '"Caveat", cursive',
      fontSize: big ? 24 : 18,
      fontWeight: 600,
      color: '#b87090',
      boxShadow: '0 4px 14px rgba(0,0,0,0.12), 0 1px 0 rgba(0,0,0,0.04) inset',
      transform: `rotate(${rotate}deg)`,
      display: 'inline-flex',
      alignItems: 'center',
      gap: 8,
      whiteSpace: 'nowrap',
      zIndex: 10,
    }}>
      {emoji && <span style={{ fontSize: big ? 22 : 18 }}>{emoji}</span>}
      <span>{children}</span>
    </div>
  );
}

// Washi tape strip
function Tape({ top, left, width = 120, height = 26, rotate = -8, pattern = 'striped', zIndex = 12 }) {
  let bg;
  if (pattern === 'striped') {
    bg = `repeating-linear-gradient(45deg, ${palette.accent}cc, ${palette.accent}cc 6px, ${palette.cream}aa 6px, ${palette.cream}aa 12px)`;
  } else if (pattern === 'dotted') {
    bg = `radial-gradient(circle, ${palette.cream}aa 1.5px, transparent 2px) 0 0/8px 8px, ${palette.denim}cc`;
  } else {
    bg = palette.accent;
  }
  return (
    <div style={{
      position: 'absolute',
      top, left,
      width, height,
      background: bg,
      transform: `rotate(${rotate}deg)`,
      clipPath: 'polygon(2% 8%, 98% 0%, 100% 92%, 1% 100%)',
      boxShadow: '0 2px 6px rgba(0,0,0,0.18)',
      zIndex,
      pointerEvents: 'none',
    }} />
  );
}

function LocationPage() {
  const [activeBubble, setActiveBubble] = React.useState(0);

  const cyclingBubbles = [

  React.useEffect(() => {
    const id = setInterval(() => setActiveBubble(b => (b + 1) % cyclingBubbles.length), 3500);
    return () => clearInterval(id);

  return (
    <div style={{
      position: 'relative',
      minHeight: '100vh',
      padding: '60px 40px 100px',
      overflow: 'hidden',

        position: 'absolute',
        top: 80, left: 60,
        background: palette.cream,
        padding: '24px 32px',
        transform: 'rotate(-3deg)',
        boxShadow: '4px 6px 14px rgba(0,0,0,0.12)',
        maxWidth: 320,
        border: '1px solid rgba(0,0,0,0.05)',
        zIndex: 8,

          fontFamily: '"Courier Prime", monospace',
          fontSize: 11,
          letterSpacing: 4,

          color: palette.navy,
          lineHeight: 1.3,

      <FloatingIcon kind="heart" top={180} left={1080} size={42} />
      <FloatingIcon kind="star" top={400} left={1200} rotate={20} size={38} />
      <FloatingIcon kind="coffee" top={620} left={120} size={48} rotate={-12} />
      <FloatingIcon kind="book" top={780} left={1240} size={50} rotate={8} />
      <FloatingIcon kind="sparkle" top={920} left={180} size={28} rotate={-15} />
      <FloatingIcon kind="cart" top={920} left={1140} size={44} />
      <FloatingIcon kind="heart" top={1080} left={420} size={32} rotate={20} />
      <FloatingIcon kind="star" top={1100} left={900} size={36} rotate={-10} />
      <FloatingIcon kind="sparkle" top={780} left={70} size={28} rotate={20} />
      <FloatingIcon kind="pin" top={620} left={1280} size={46} rotate={-8} />

      {/* ====== MAP FRAME — your map goes here ====== */}
      <div style={{
        position: 'relative',
        margin: '180px auto 0',
        maxWidth: 1100,
        zIndex: 5,
      }}>
        {/* Polaroid-style frame around the map */}
        <div className="scrap-tilt" style={{
          background: palette.cream,
          padding: '24px 24px 80px',
          boxShadow: '8px 14px 32px rgba(0,0,0,0.2), inset 0 0 0 1px rgba(0,0,0,0.05)',
          transform: 'rotate(-1deg)',
          position: 'relative',
        }}>
          {/* MAP PLACEHOLDER — replace with your real <iframe> Google Map */}
          <div style={{
            width: '100%',
            aspectRatio: '2 / 1',
            background: `
              linear-gradient(135deg, #e8f0e0 0%, #f4e8d8 50%, #e0d8c8 100%)
            `,
            position: 'relative',
            overflow: 'hidden',
            border: '1px solid rgba(0,0,0,0.05)',
          }}>
            {/* Fake road lines */}
            <svg viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice"
                 style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}>
              <path d="M 0 200 L 1000 250" stroke="#fff" strokeWidth="40" />
              <path d="M 0 200 L 1000 250" stroke="#e0d8c8" strokeWidth="44" fill="none" opacity="0.5" />
              <path d="M 300 0 L 320 500" stroke="#fff" strokeWidth="32" />
              <path d="M 700 0 L 680 500" stroke="#fff" strokeWidth="32" />
              <path d="M 0 380 L 1000 420" stroke="#fff" strokeWidth="28" />
              {/* park */}
              <ellipse cx="500" cy="260" rx="100" ry="60" fill="#cde8c8" />
              {/* main pin */}
              <g transform="translate(490, 220)">
                <path d="M 0 -10 C -15 -10 -25 0 -25 18 C -25 38 0 70 0 70 C 0 70 25 38 25 18 C 25 0 15 -10 0 -10 Z"
                      fill="#e0337a" stroke="#fff" strokeWidth="3" />
                <circle cx="0" cy="14" r="9" fill="#fff" />
              </g>
              <text x="500" y="160" textAnchor="middle" fontFamily="Inter" fontSize="14" fontWeight="600" fill="#e0337a">
                National University
              </text>
              <text x="500" y="178" textAnchor="middle" fontFamily="Inter" fontSize="14" fontWeight="600" fill="#e0337a">
                of Mongolia

              {/* secondary buildings */}

              <rect x="800" y="320" width="70" height="60" fill="#fff" stroke="#e0dccf" />

              <svg viewBox="0 0 200 360" width="100%" height="100%">

                </defs>
                <ellipse cx="100" cy="60" rx="40" ry="44" fill="url(#stripe2)" stroke={palette.navy} strokeWidth="2.5" />
                <path d="M 60 50 Q 58 18 100 12 Q 142 18 140 55 Q 140 30 122 22 Q 100 18 78 22 Q 60 30 60 55 Z" fill={palette.navy} opacity="0.9" />
                <rect x="92" y="100" width="16" height="14" fill="url(#stripe2)" stroke={palette.navy} strokeWidth="2.5" />
                <path d="M 70 116 Q 86 110 100 110 Q 114 110 130 116 L 142 230 Q 142 240 132 240 L 68 240 Q 58 240 58 230 Z"
                      fill="url(#stripe2)" stroke={palette.navy} strokeWidth="2.5" strokeLinejoin="round" />
                <path d="M 148 220 C 148 213 158 210 162 218 C 166 210 176 213 176 220 C 176 232 162 244 162 244 C 162 244 148 232 148 220 Z" fill={palette.denim} transform="translate(-62, -10)" />
                <path d="M 82 240 L 78 340 Q 78 350 88 350 L 96 350 Q 104 350 104 340 L 102 240 Z" fill="url(#stripe2)" stroke={palette.navy} strokeWidth="2.5" />
                <path d="M 104 240 L 106 340 Q 106 350 116 350 L 124 350 Q 132 350 132 340 L 128 240 Z" fill="url(#stripe2)" stroke={palette.navy} strokeWidth="2.5" />
                <ellipse cx="91" cy="350" rx="14" ry="5" fill={palette.navy} />
                <ellipse cx="120" cy="350" rx="14" ry="5" fill={palette.navy} />
                <text x="100" y="180" textAnchor="middle" fontFamily="JetBrains Mono" fontSize="9" fill={palette.navy} opacity="0.7" letterSpacing="2">[YOU]</text>
              </svg>
            </div>

            {/* Pin callout labels around the map */}
            <div style={{
              position: 'absolute',
              top: '15%', right: '10%',
              background: '#fff',
              padding: '6px 12px',
              borderRadius: 999,
              fontFamily: 'Inter',
              fontSize: 11,
              fontWeight: 600,
              color: palette.navy,
              boxShadow: '0 2px 8px rgba(0,0,0,0.15)',
              transform: 'rotate(3deg)',
            }}>📚 my faculty</div>

            <div style={{
              position: 'absolute',
              bottom: '12%', left: '8%',
              background: '#fff',
              padding: '6px 12px',
              borderRadius: 999,
              fontFamily: 'Inter',
              fontSize: 11,
              fontWeight: 600,
              color: palette.navy,
              boxShadow: '0 2px 8px rgba(0,0,0,0.15)',
              transform: 'rotate(-4deg)',
            }}>☕ favorite café</div>
          </div>

          {/* polaroid caption under the map */}
          <div style={{
            position: 'absolute',
            bottom: 22,
            left: 0, right: 0,
            textAlign: 'center',
            fontFamily: '"Caveat", cursive',
            fontSize: 28,
            color: palette.navy,
          }}>
            National University of Mongolia · est. 1942
            <span style={{ fontSize: 16, opacity: 0.6, marginLeft: 12 }}>↗ open in maps</span>
          </div>
        </div>

        {/* tape across the map polaroid */}
        <div style={{ position: 'absolute', top: -14, left: '40%', width: 160, height: 32, transform: 'rotate(-6deg)',
          background: `repeating-linear-gradient(45deg, ${palette.accent}cc 0 6px, ${palette.cream}aa 6px 12px)`,
          clipPath: 'polygon(2% 8%, 98% 0%, 100% 92%, 1% 100%)',
          boxShadow: '0 2px 6px rgba(0,0,0,0.18)', zIndex: 20 }} />
        <div style={{ position: 'absolute', top: -8, right: 80, width: 130, height: 28, transform: 'rotate(8deg)',
          background: `${palette.denim}cc`,
          clipPath: 'polygon(2% 8%, 98% 0%, 100% 92%, 1% 100%)',
          boxShadow: '0 2px 6px rgba(0,0,0,0.18)', zIndex: 20 }} />
      </div>

      {/* ====== CYCLING SPEECH BUBBLES ====== */}
      {cyclingBubbles.map((b, i) => (
        <div key={i} className="bubble-cycle" style={{
          position: 'absolute',
          top: b.top, left: b.left,
          opacity: i === activeBubble ? 1 : 0,
          transform: `translateY(${i === activeBubble ? 0 : -8}px) scale(${i === activeBubble ? 1 : 0.92}) rotate(${b.rotate}deg)`,
          zIndex: 15,
        }}>
          <Bubble emoji={b.emoji} big>{b.text}</Bubble>
        </div>
      ))}

      {/* a static "where am i" bubble on the right */}
      <Bubble top={360} left={1080} rotate={6} emoji="📍">established 2022</Bubble>

      {/* ====== BELOW-MAP DETAIL CARDS ====== */}

        maxWidth: 1100,
        margin: '80px auto 0',
        display: 'grid',
        gridTemplateColumns: '1.2fr 1fr 1fr',
        gap: 28,
        position: 'relative',
        zIndex: 6,

        {/* Card 1: address (notepad) */}
        <div className="scrap-tilt" style={{
          background: '#fff8eb',
          padding: '28px 30px',
          transform: 'rotate(-1.5deg)',
          boxShadow: '4px 8px 18px rgba(0,0,0,0.15)',
          backgroundImage: `repeating-linear-gradient(transparent 0 27px, ${palette.accent}66 27px 28px)`,
          position: 'relative',
        }}>
          <div style={{
            fontFamily: '"Caveat", cursive', fontSize: 32, color: palette.navy, marginBottom: 10,
          }}>📮 the address</div>
          <div style={{
            fontFamily: '"Caveat", cursive', fontSize: 22, color: palette.navy, lineHeight: 1.5,
          }}>
            WWF9+6H6, SBD<br/>
            6 khoroo,<br/>
            Ulaanbaatar 14200<br/>
            Mongolia 🇲🇳
          </div>
        </div>

        {/* Card 2: hours (ticket stub) */}
        <div className="scrap-tilt" style={{
          background: palette.cream,
          padding: '28px 30px',
          transform: 'rotate(1.5deg)',
          boxShadow: '4px 8px 18px rgba(0,0,0,0.15)',
          border: `2px dashed ${palette.navy}`,
        }}>
          <div style={{
            fontFamily: '"Courier Prime", monospace', fontSize: 12, letterSpacing: 3, color: palette.navy,
            opacity: 0.6, textTransform: 'uppercase', marginBottom: 12,
          }}>★ ticket stub ★</div>
          <div style={{
            fontFamily: '"Caveat", cursive', fontSize: 30, color: palette.navy, marginBottom: 6,
          }}>nymtuul · 2022—now</div>
          <div style={{
            fontFamily: '"Caveat", cursive', fontSize: 20, color: palette.navy, lineHeight: 1.4,
          }}>
            🎓 student of [discipline]<br/>
            ⭐ rating: 4.5 (272 reviews)
          </div>
        </div>

        {/* Card 3: nearby (highlighted) */}
        <div className="scrap-tilt" style={{
          background: palette.accent,
          padding: '28px 30px',
          transform: 'rotate(-2deg)',
          boxShadow: '4px 8px 18px rgba(0,0,0,0.15)',
          position: 'relative',
        }}>
          <div style={{
            fontFamily: '"Caveat", cursive', fontSize: 30, color: palette.navy, marginBottom: 10,
          }}>nearby ↘</div>
          <div style={{
            fontFamily: '"Caveat", cursive', fontSize: 20, color: palette.navy, lineHeight: 1.5,
          }}>
            ☕ Karaoke spot<br/>
            🏛 Chinggis Khaan museum<br/>
            🌳 Gov Outdoor Park<br/>
            🏨 UB Grand Hotel<br/>
            🎵 Music College
          </div>
          <div style={{
            position: 'absolute', top: -16, right: 18,
            background: palette.navy, color: palette.cream,
            padding: '4px 12px', borderRadius: 999,
            fontFamily: '"Courier Prime", monospace', fontSize: 11, fontWeight: 700,
            letterSpacing: 1, transform: 'rotate(8deg)',
          }}>★ FAVES</div>
        </div>
      </div>

      {/* ====== HANDWRITTEN MARGIN NOTE BOTTOM ====== */}
      <div style={{
        textAlign: 'center',
        marginTop: 80,
        fontFamily: '"Caveat", cursive',
        fontSize: 30,
        color: palette.navy,
        opacity: 0.85,
      }}>
        ~ if you visit, bring snacks ~ 🍓
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<LocationPage />);
</script>

</body>
</html>
